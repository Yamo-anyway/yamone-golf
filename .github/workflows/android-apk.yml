name: Android QA APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop/0.3.x
    paths:
      - ".github/workflows/android-apk.yml"
      - "assets/**"
      - "locales/**"
      - "src/**"
      - "app.config.ts"
      - "app.json"
      - "babel.config.js"
      - "metro.config.js"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "yamone-golf-cloudflare/**"

permissions:
  contents: read

concurrency:
  group: android-qa-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_PUBLIC_API_URL: https://yamone-golf-api.yamone-golf.workers.dev
      EXPO_PUBLIC_ADS_MODE: admob-test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run required quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./package.json').version")"
          apk_name="yamone-golf-v${app_version}-android-test.apk"
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/${apk_name}"
          unzip -t "artifacts/${apk_name}"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose "artifacts/${apk_name}"
          (
            cd artifacts
            sha256sum "${apk_name}" > "${apk_name}.sha256"
          )

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamone-golf-android-test-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
